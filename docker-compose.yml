services:
  server:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./Server:/app
      - server_node_modules:/app/node_modules
    command: sh -c "npm ci && npm start"
    env_file:
      - ./Server/.env
    ports:
      - "3000:3000"

  client:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./Client:/app
      - client_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    env_file:
      - ./Client/.env
    ports:
      - "3001:3001"
    depends_on:
      - server

  admin:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./Admin:/app
      - admin_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    env_file:
      - ./Admin/.env
    ports:
      - "3002:3002"
    depends_on:
      - server

volumes:
  server_node_modules:
  client_node_modules:
  admin_node_modules: